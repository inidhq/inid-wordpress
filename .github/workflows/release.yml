name: release
# Every change on main that passes the tests gets the next version, as a tag vX.Y.Z that
# publish.yml takes from there. A patch by default; a commit saying feat / feature / new / add
# or [minor]: the minor; BREAKING or "type!:": the major (the minor while 0.x). The version
# isn't written in the files: each package gets it when it's built, so InID's own repo,
# which this one mirrors, never clashes with release commits.
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A tag pushed with this repo's deploy key starts publish.yml (one pushed with
          # GITHUB_TOKEN wouldn't)
          ssh-key: ${{ secrets.RELEASE_KEY }}
      - name: Tag the next version
        env:
          FIRST: "0.7.2"
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range="${last:+$last..}HEAD"
          changes=$(git log --format='%s%n%b' "$range" -- . ':(exclude)*.md' ':(exclude).github' || true)
          if [ -z "$(printf %s "$changes" | tr -d '[:space:]')" ]; then echo "Nothing new to release"; exit 0; fi
          if [ -z "$last" ]; then
            next="$FIRST"
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            if grep -qE 'BREAKING|^[a-z]+(\([^)]*\))?!:' <<<"$changes"; then
              if [ "$major" = 0 ]; then next="0.$((minor + 1)).0"; else next="$((major + 1)).0.0"; fi
            elif grep -qiE '^(feat|feature|new|add)([:( ]|$)|\[minor\]' <<<"$changes"; then
              next="$major.$((minor + 1)).0"
            else
              next="$major.$minor.$((patch + 1))"
            fi
          fi
          echo "Releasing v$next (after ${last:-nothing})"
          git tag "v$next"
          git push origin "v$next"
