name: test
on:
  pull_request:
  push:
    branches-ignore: [main]  # main: release.yml runs these first
  workflow_call:
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      # Every file parses on the oldest PHP the plugin supports and the newest
      - run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
